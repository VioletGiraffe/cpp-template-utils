name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build & test on ${{ matrix.os }}, ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        # Debug keeps the asserts: the containers guard their invariants with them
        config: [release, debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Linux - install a compiler with C++20 support
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update -y
        sudo apt install -qq gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 50
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 50

    - name: Windows - build & test
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: scripts\run_tests.bat ${{ matrix.config }}

    - name: Unix - build & test
      if: ${{ !startsWith(matrix.os, 'windows') }}
      run: ./scripts/run_tests.sh ${{ matrix.config }}
